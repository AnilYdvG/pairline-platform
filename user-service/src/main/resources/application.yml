spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/pairline_users?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always